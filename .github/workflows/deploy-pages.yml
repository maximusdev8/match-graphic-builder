name: Deploy to GitHub Pages

on:
  # Publish whenever the site changes on the default branch.
  push:
    branches: [main]
  # Allows the workflow to be run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns GitHub Pages on via the API if it has not
        # been enabled yet, so no manual Settings -> Pages step is required.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        # The site is a static file at the repository root, so the whole
        # root is published as-is. There is no build step.
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
